{% extends "base.html" %}

{% load static %}
{% block title %}Каталог{% endblock %}

{% block content %}
  <div class="container">
    <div class="header">
      <h1>Каталог</h1>
        </div>

            <div class="sort-block">
                <span class="sort-item">Сортировать по:</span>
                        <a class="sort-item" href="?sort=name">Названию</a>
                        <a class="sort-item" href="?sort=min_price">Начиная с дешевых</a>
                        <a class="sort-item" href="?sort=max_price">Начиная с дорогих</a>
            </div>
            <br />
            <div class="container">
                <div class = "row">
                  {% for phone in phones %}
                        <div class="col">
                            <a href="{% url 'show_product' phone.slug %}">
                                <h3>{{ phone.name }}</h3>
                            </a>
                            <div class="price">Стоимость: {{ phone.price }} ₽</div>
                            <img height="400" src="{{ phone.image }}" alt="{{ phone.name }}"/>
                        </div>
                  {% endfor %}
                </div>
            </div>
  </div>
{% endblock %}
